# k2_asa_purge_fix.cfg
# Fix for CFS purging the nozzle at 220C regardless of filament (ASA worst-hit).
#
# Root cause: the native FILAMENT_RACK_SET_TEMP (filament_rack_wrapper.so) looks up
# the slot's material temp by string-comparing the slot's 6-digit id ("003001")
# against the DB's 5-digit base.id ("03001"). It never matches, so it falls back to
# Tn_extrude_temp = 220 for EVERY material. 220 is far too cold for ASA.
#
# This wraps the native command: instead of the broken 220 fallback, it purges at the
# temperature already set for the loaded material (what the UI/slicer set), with a safe
# floor when none is set. Lives in printer config (NOT cloud-synced), so it is permanent.

[gcode_macro K2_PURGE_FIX]
variable_min_purge_temp: 240     # floor used only if no sane target is preset; safe for ASA/ABS/PETG
gcode:

[gcode_macro FILAMENT_RACK_SET_TEMP]
rename_existing: _FACTORY_FILAMENT_RACK_SET_TEMP
gcode:
    {% set tgt   = printer.extruder.target|int %}
    {% set floor = printer['gcode_macro K2_PURGE_FIX'].min_purge_temp|int %}
    # Honor the material temp already chosen for this load; otherwise use a safe floor.
    {% set t = tgt if tgt >= 200 else floor %}
    { action_respond_info("K2_PURGE_FIX: purge temp %d (was target %d, factory would use 220)" % (t, tgt)) }
    M104 S{t}
    M109 S{t}
