# k2_asa_purge_fix.cfg
# Fix for the CFS purging the nozzle at 220C regardless of filament (ASA worst-hit).
#
# Root cause: native FILAMENT_RACK_SET_TEMP (filament_rack_wrapper.so) looks up the
# slot's material temp by string-comparing the slot's 6-digit id ("003001") against
# the DB's 5-digit base.id ("03001"); it never matches, so it falls back to a
# hardcoded 220C for EVERY material. 220 is far too cold for ASA.
#
# This wraps the native command (rename_existing) and instead heats to a temperature
# that is SAFE FOR BOTH the outgoing (in-nozzle) and incoming filament: the overlap
# of their melt-safe ranges  [max(minTemp), min(maxTemp)].  If the ranges don't
# overlap (e.g. PLA <-> PC) the change is aborted with an error.
#
# The overlap logic lives in the companion Klipper extra purge_temp_fix.py
# (-> /usr/share/klipper/klippy/extras/purge_temp_fix.py).

[purge_temp_fix]
# material_database: /mnt/UDISK/creality/userdata/box/material_database.json  # default
# strict_incompatible: True     # error on no-overlap (default). False -> warn + use incoming only.
# absolute_min_temp: 170
# absolute_max_temp: 320

[gcode_macro FILAMENT_RACK_SET_TEMP]
rename_existing: _FACTORY_FILAMENT_RACK_SET_TEMP
gcode:
    # Heat to a temp safe for both outgoing + incoming filament (errors if impossible),
    # instead of the broken native lookup's 220C fallback.
    CFS_SMART_PURGE_SET_TEMP
